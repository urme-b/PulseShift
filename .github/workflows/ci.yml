name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r research/requirements.txt -r research/requirements-dev.txt
      - name: Run tests
        run: |
          cd research
          PYTHONPATH=. pytest tests/ -q
